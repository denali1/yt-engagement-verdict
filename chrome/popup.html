<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Engagement Verdict</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Roboto", "Arial", sans-serif; font-size: 13px; width: 280px; background: #0f0f0f; color: #f1f1f1; padding: 16px; }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    header h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.01em; }
    header span.icon { font-size: 20px; }
    #status { font-size: 12px; color: #aaa; line-height: 1.6; }
    #verdict-display { margin-top: 12px; }
    .verdict-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .verdict-emoji { font-size: 22px; }
    .verdict-label { font-size: 16px; font-weight: 700; }
    .score-line { font-size: 11px; color: #aaa; margin-bottom: 10px; }
    .bar-wrap { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    .bar-fill { height: 100%; border-radius: 3px; background: #4caf50; }
    .signal-list { list-style: none; font-size: 12px; color: #ccc; display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .signal-list li { display: flex; align-items: center; gap: 7px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-high { background: #4caf50; }
    .dot-mid  { background: #ff8c00; }
    .dot-low  { background: #ff4444; }
    footer { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; font-size: 11px; color: #666; }
    footer a { color: #3ea6ff; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="icon">📊</span>
    <h1>YT Engagement Verdict</h1>
  </header>

  <div id="status">Navigate to a YouTube video to see its engagement verdict.</div>
  <div id="verdict-display" hidden></div>

  <footer>
    <div id="selector-status" style="margin-bottom:7px; display:flex; align-items:center; justify-content:space-between;">
      <span id="selector-version" style="color:#555;">Selectors: —</span>
      <button id="refresh-selectors" title="Force re-fetch selectors.json from GitHub" style="
        background:none; border:1px solid #333; color:#aaa; font-size:10px;
        padding:2px 7px; border-radius:4px; cursor:pointer; letter-spacing:0.03em;
      ">↻ Refresh</button>
    </div>
    <div style="margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;">
      <span style="color:#555; font-size:11px;">Share anonymous data</span>
      <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
        <input type="checkbox" id="telemetry-toggle" style="cursor:pointer;">
        <span id="telemetry-label" style="font-size:10px; color:#555;">Off</span>
      </label>
    </div>
    <a href="https://github.com/Denali1/yt-engagement-verdict" target="_blank">GitHub ↗</a>
    &nbsp;·&nbsp;
    <a href="https://returnyoutubedislike.com" target="_blank">Return YouTube Dislike ↗</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
